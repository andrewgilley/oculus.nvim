[package]
name = "oculus-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "oculus_engine"
path = "src/lib.rs"

[[bin]]
name = "oculus-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-c = "0.23"
tree-sitter-lua = "0.2"
